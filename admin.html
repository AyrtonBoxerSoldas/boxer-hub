<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin — Boxer Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;color:#1a202c}
.topbar{background:linear-gradient(135deg,#1d327b,#162666);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #25bbee}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{color:#fff;font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:16px}
.user-badge{color:#93b4d4;font-size:13px}.user-badge strong{color:#fff}
.logout-btn{color:#93b4d4;font-size:13px;padding:6px 12px;border:1px solid rgba(255,255,255,.2);border-radius:6px;cursor:pointer}
.logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.notif-badge{background:#e30613;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;cursor:pointer}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-family:Outfit;font-size:13px;font-weight:500;z-index:2000;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:#16a34a}.toast-error{background:#dc2626}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}

.tabs{display:flex;gap:4px;padding:16px 24px 0;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.tab{padding:10px 20px;border-radius:8px 8px 0 0;border:1px solid #d0d8e8;border-bottom:none;background:#fff;color:#4a5568;cursor:pointer;font-family:Outfit;font-size:14px;font-weight:500}
.tab:hover{color:#1d327b}
.tab.active{background:#1d327b;color:#fff;border-color:#1d327b}
.panel{max-width:1400px;margin:0 auto;padding:0 24px 24px}
.panel-content{background:#fff;border:1px solid #d0d8e8;border-radius:0 8px 8px 8px;padding:20px}
.hidden{display:none!important}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 12px;text-align:left;color:#718096;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;background:#f7fafc}
tbody td{padding:8px 12px;border-bottom:1px solid #e2e8f0;vertical-align:middle}
tbody tr:hover{background:#f0f7ff}

.btn{padding:8px 16px;border-radius:8px;border:1px solid;font-family:Outfit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#1d327b;color:#fff;border-color:#1d327b}.btn-primary:hover{background:#162666}
.btn-outline{background:#fff;color:#4a5568;border-color:#c3cfe2}.btn-outline:hover{border-color:#25bbee;color:#1d327b}
.btn-danger{background:#fff;color:#e30613;border-color:#fecaca}.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:4px 10px;font-size:12px}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:16px;font-weight:600;color:#1d327b}
.empty-state{text-align:center;padding:40px 20px;color:#718096}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:500;color:#4a5568;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 12px;border:1px solid #c3cfe2;border-radius:6px;font-family:Outfit;font-size:13px;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#25bbee}
.form-row-inline{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0}

.role-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.role-admin{background:#7c3aed;color:#fff}
.role-manager{background:#1d327b;color:#fff}
.role-analyst{background:#25bbee;color:#fff}
.role-financial{background:#16a34a;color:#fff}
.role-rep{background:#e97316;color:#fff}
.role-dealer{background:#6b7280;color:#fff}

.etapa-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.etapa-formulario{background:#dbeafe;color:#1e40af}
.etapa-aprovacao_docs{background:#fef3c7;color:#92400e}
.etapa-validacao_ia{background:#e0e7ff;color:#3730a3}
.etapa-aprovacao_adm_vendas{background:#fce7f3;color:#9d174d}
.etapa-analise_credito{background:#ccfbf1;color:#115e59}
.etapa-aprovacao_credito{background:#fef3c7;color:#78350f}
.etapa-ativacao{background:#d1fae5;color:#065f46}
.etapa-ativo{background:#16a34a;color:#fff}
.etapa-rejeitado{background:#fee2e2;color:#991b1b}

.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:6px 14px;border-radius:6px;border:1px solid #c3cfe2;background:#fff;font-family:Outfit;font-size:12px;font-weight:500;color:#4a5568;cursor:pointer}
.filter-btn:hover{border-color:#25bbee;color:#1d327b}
.filter-btn.active{background:#1d327b;color:#fff;border-color:#1d327b}
.filter-count{font-size:10px;background:rgba(255,255,255,.3);padding:1px 5px;border-radius:8px;margin-left:3px}

.detail-section{margin-bottom:16px;padding:14px;background:#f7fafc;border-radius:8px;border:1px solid #e2e8f0}
.detail-section h4{font-size:12px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.detail-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.detail-label{color:#718096}
.detail-value{color:#1a202c;font-weight:500;text-align:right;max-width:65%}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0}
.btn-success{background:#16a34a;color:#fff;border-color:#16a34a}.btn-success:hover{background:#15803d}
.btn-warn{background:#f59e0b;color:#fff;border-color:#f59e0b}.btn-warn:hover{background:#d97706}
select,input,textarea{font-family:Outfit,sans-serif}
</style>
</head>
<body>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('onboarding',this)">Onboarding</div>
  <div class="tab" onclick="showTab('usuarios',this)">Usuarios</div>
  <div class="tab" onclick="showTab('campanhas',this)">Campanhas</div>
  <div class="tab" onclick="showTab('precos',this)">Tabelas de Preco</div>
  <div class="tab" onclick="showTab('regras',this)">Regras Comerciais</div>
  <div class="tab" onclick="showTab('logs',this)">Logs</div>
</div>
<div class="panel">
  <div class="panel-content" id="tab-onboarding">
    <div class="page-header">
      <h2 class="page-title">Pipeline de Onboarding</h2>
    </div>
    <div class="filter-bar" id="onbFilterBar"></div>
    <div id="onboardingList"></div>
  </div>
  <div class="panel-content hidden" id="tab-usuarios">
    <div class="page-header">
      <h2 class="page-title">Usuarios do Hub</h2>
      <button class="btn btn-primary" onclick="openNovoUsuario()">Novo usuario</button>
    </div>
    <div id="usuariosList"></div>
  </div>
  <div class="panel-content hidden" id="tab-campanhas">
    <div class="page-header">
      <h2 class="page-title">Campanhas</h2>
      <button class="btn btn-primary" onclick="openNovaCampanha()">Nova campanha</button>
    </div>
    <div id="campanhasList"></div>
  </div>
  <div class="panel-content hidden" id="tab-precos">
    <div class="page-header"><h2 class="page-title">Tabelas de Preco</h2></div>
    <div id="precosList"></div>
  </div>
  <div class="panel-content hidden" id="tab-regras">
    <div class="page-header"><h2 class="page-title">Regras Comerciais</h2></div>
    <div id="regrasList"></div>
  </div>
  <div class="panel-content hidden" id="tab-logs">
    <div class="page-header"><h2 class="page-title">Logs de Auditoria</h2></div>
    <div id="logsList"></div>
  </div>
</div>

<script src="hub.js"></script>
<script>
if (!requireAuth()) throw 'auth';

function showTab(n, el) {
  document.querySelectorAll('.panel-content').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + n).classList.remove('hidden');
  el.classList.add('active');
}

(async () => {
  await loadPerfil();
  if (!['admin','manager','analyst','financial'].includes(getUserRole())) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#718096;font-family:Outfit"><h2>Acesso restrito</h2></div>';
    return;
  }
  renderTopbar('Admin');
  await loadOnboardings();
})();

async function loadUsuarios() {
  const wrap = document.getElementById('usuariosList');
  try {
    const users = await sb('/hub_perfis?order=nome.asc&select=*');
    if (!users.length) { wrap.innerHTML = '<div class="empty-state"><h3>Nenhum usuario</h3></div>'; return; }
    wrap.innerHTML = `<div style="overflow-x:auto"><table>
      <thead><tr><th>Nome</th><th>Email</th><th>Tipo</th><th>Role</th><th>Ativo</th><th></th></tr></thead>
      <tbody>${users.map(u => `<tr>
        <td><strong>${u.nome}</strong></td>
        <td>${u.email}</td>
        <td>${u.tipo}</td>
        <td><span class="role-badge role-${u.role}">${u.role}</span></td>
        <td>${u.ativo ? 'Sim' : 'Nao'}</td>
        <td><button class="btn btn-outline btn-sm" onclick="editUsuario('${u.id}')">Editar</button></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  } catch (e) { wrap.innerHTML = '<div class="empty-state"><h3>Erro ao carregar usuarios</h3></div>'; }
}

function openNovoUsuario() {
  openModal(`
    <h3 style="font-size:18px;margin-bottom:16px;color:#1d327b">Novo Usuario</h3>
    <div class="form-row-inline">
      <div class="form-row"><label>Nome</label><input id="uNome" placeholder="Nome completo"></div>
      <div class="form-row"><label>Email</label><input id="uEmail" type="email" placeholder="email@empresa.com"></div>
    </div>
    <div class="form-row-inline">
      <div class="form-row">
        <label>Tipo</label>
        <select id="uTipo">
          <option value="cliente">Cliente</option>
          <option value="representante">Representante</option>
          <option value="funcionario">Funcionario</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-row">
        <label>Role</label>
        <select id="uRole">
          <option value="dealer">Dealer</option>
          <option value="rep">Rep</option>
          <option value="analyst">Analyst</option>
          <option value="manager">Manager</option>
          <option value="financial">Financial</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="form-row"><label>Telefone</label><input id="uTel" placeholder="(11) 99999-9999"></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarUsuario()">Criar</button>
    </div>
  `);
}

async function salvarUsuario() {
  toast('Criacao de usuario em desenvolvimento');
  closeModal();
}

async function editUsuario(id) {
  toast('Edicao de usuario em desenvolvimento');
}

function openNovaCampanha() {
  toast('Campanhas em desenvolvimento');
}

// === ONBOARDING ===

const ETAPAS = [
  { key: 'formulario', label: 'Formulario', short: 'Form' },
  { key: 'aprovacao_docs', label: 'Aprovacao Docs', short: 'Docs' },
  { key: 'validacao_ia', label: 'Validacao IA', short: 'IA' },
  { key: 'aprovacao_adm_vendas', label: 'ADM Vendas', short: 'ADM' },
  { key: 'analise_credito', label: 'Analise Credito', short: 'Credito' },
  { key: 'aprovacao_credito', label: 'Financeiro', short: 'Fin' },
  { key: 'ativacao', label: 'Ativacao', short: 'Ativar' },
  { key: 'ativo', label: 'Ativo', short: 'Ativo' },
  { key: 'rejeitado', label: 'Rejeitado', short: 'Rej' }
];

let allOnboardings = [];
let onbFilter = 'pendentes';
let _currentOnbId = null;

async function loadOnboardings() {
  const wrap = document.getElementById('onboardingList');
  try {
    allOnboardings = await sb('/hub_onboarding?ativo=eq.true&order=criado_em.desc&select=*');
    renderOnbFilters();
    renderOnbList();
  } catch (e) {
    wrap.innerHTML = '<div class="empty-state"><h3>Erro ao carregar onboardings</h3><p>' + e.message + '</p></div>';
  }
}

function renderOnbFilters() {
  const counts = {};
  ETAPAS.forEach(e => counts[e.key] = 0);
  allOnboardings.forEach(o => { if (counts[o.etapa_atual] !== undefined) counts[o.etapa_atual]++; });
  const pendentes = allOnboardings.filter(o => !['ativo','rejeitado'].includes(o.etapa_atual)).length;

  let html = `<button class="filter-btn ${onbFilter === 'pendentes' ? 'active' : ''}" onclick="setOnbFilter('pendentes')">Pendentes<span class="filter-count">${pendentes}</span></button>`;
  html += `<button class="filter-btn ${onbFilter === 'todos' ? 'active' : ''}" onclick="setOnbFilter('todos')">Todos<span class="filter-count">${allOnboardings.length}</span></button>`;
  ETAPAS.forEach(e => {
    if (counts[e.key] > 0) {
      html += `<button class="filter-btn ${onbFilter === e.key ? 'active' : ''}" onclick="setOnbFilter('${e.key}')">${e.short}<span class="filter-count">${counts[e.key]}</span></button>`;
    }
  });
  document.getElementById('onbFilterBar').innerHTML = html;
}

function setOnbFilter(f) {
  onbFilter = f;
  renderOnbFilters();
  renderOnbList();
}

function renderOnbList() {
  let list = allOnboardings;
  if (onbFilter === 'pendentes') list = list.filter(o => !['ativo','rejeitado'].includes(o.etapa_atual));
  else if (onbFilter !== 'todos') list = list.filter(o => o.etapa_atual === onbFilter);

  const wrap = document.getElementById('onboardingList');
  if (!list.length) {
    wrap.innerHTML = '<div class="empty-state"><h3>Nenhum cadastro nesta etapa</h3></div>';
    return;
  }

  wrap.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>CNPJ</th><th>Razao Social</th><th>Classificacao</th><th>Etapa</th><th>Data</th><th></th></tr></thead>
    <tbody>${list.map(o => `<tr>
      <td>${fmtCnpj(o.cnpj)}</td>
      <td><strong>${o.razao_social}</strong><br><span style="font-size:11px;color:#718096">${o.nome_fantasia || ''}</span></td>
      <td>${o.classificacao ? '<span style="font-weight:600;text-transform:uppercase;font-size:11px">' + o.classificacao + '</span>' : '—'}</td>
      <td><span class="etapa-badge etapa-${o.etapa_atual}">${etapaLabel(o.etapa_atual)}</span></td>
      <td style="white-space:nowrap">${fmtData(o.criado_em)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="openOnbDetail('${o.id}')">Detalhes</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function etapaLabel(e) {
  const found = ETAPAS.find(x => x.key === e);
  return found ? found.label : e;
}

function openOnbDetail(id) {
  const o = allOnboardings.find(x => x.id === id);
  if (!o) return;
  _currentOnbId = id;

  const contatos = o.contatos || [];
  const enderecos = o.enderecos || [];
  const end = enderecos[0] || {};
  const respostas = o.respostas_classificacao || {};

  let actionsHtml = buildOnbActions(o);

  const html = `
    <h3 style="font-size:18px;margin-bottom:4px;color:#1d327b">${o.razao_social}</h3>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
      <span class="etapa-badge etapa-${o.etapa_atual}">${etapaLabel(o.etapa_atual)}</span>
      <span style="font-size:12px;color:#718096">Criado em ${fmtData(o.criado_em)}</span>
    </div>

    <div class="detail-section">
      <h4>Empresa</h4>
      <div class="detail-row"><span class="detail-label">CNPJ</span><span class="detail-value">${fmtCnpj(o.cnpj)}</span></div>
      <div class="detail-row"><span class="detail-label">Razao Social</span><span class="detail-value">${o.razao_social}</span></div>
      <div class="detail-row"><span class="detail-label">Fachada</span><span class="detail-value">${o.nome_fantasia || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">IE</span><span class="detail-value">${o.inscricao_estadual || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${o.contato_email || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Telefone</span><span class="detail-value">${o.contato_telefone || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Responsavel</span><span class="detail-value">${o.contato_nome || '—'}</span></div>
    </div>

    <div class="detail-section">
      <h4>Endereco</h4>
      <div class="detail-row"><span class="detail-label">CEP</span><span class="detail-value">${end.cep || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Logradouro</span><span class="detail-value">${end.logradouro || '—'}, ${end.numero || ''} ${end.complemento || ''}</span></div>
      <div class="detail-row"><span class="detail-label">Bairro</span><span class="detail-value">${end.bairro || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Cidade/UF</span><span class="detail-value">${end.cidade || '—'} / ${end.uf || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">IBGE</span><span class="detail-value">${end.ibge_codigo || '—'}</span></div>
    </div>

    <div class="detail-section">
      <h4>Contatos</h4>
      ${contatos.map(c => `
        <div style="padding:6px 0;border-bottom:1px solid #e2e8f0">
          <div style="font-size:12px;font-weight:600;color:#1d327b;text-transform:uppercase">${c.tipo || 'Contato'}</div>
          <div class="detail-row"><span class="detail-label">Nome</span><span class="detail-value">${c.nome}</span></div>
          <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${c.email}</span></div>
          <div class="detail-row"><span class="detail-label">Telefone</span><span class="detail-value">${c.telefone}</span></div>
        </div>
      `).join('')}
    </div>

    <div class="detail-section">
      <h4>Perfil e Classificacao</h4>
      <div class="detail-row"><span class="detail-label">Loja Fisica</span><span class="detail-value">${respostas.loja_fisica ? 'Sim' : 'Nao'}</span></div>
      <div class="detail-row"><span class="detail-label">Marketplaces</span><span class="detail-value">${respostas.marketplaces?.ativo ? 'Sim — ' + (respostas.marketplaces.quais||[]).join(', ') : 'Nao'}</span></div>
      <div class="detail-row"><span class="detail-label">Equipe Vendas</span><span class="detail-value">${respostas.equipe_vendas || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Site Proprio</span><span class="detail-value">${respostas.site_proprio?.ativo ? 'Sim — ' + (respostas.site_proprio.url || '') : 'Nao'}</span></div>
      <div class="detail-row"><span class="detail-label">Perfil Loja</span><span class="detail-value">${(respostas.perfil_loja||[]).join(', ') || '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Classificacao</span><span class="detail-value" style="font-weight:700;color:#1d327b">${(o.classificacao||'—').toUpperCase()}</span></div>
      <div class="detail-row"><span class="detail-label">Regiao</span><span class="detail-value">${o.regiao || '—'}</span></div>
    </div>

    ${o.limite_aprovado ? `<div class="detail-section">
      <h4>Credito</h4>
      <div class="detail-row"><span class="detail-label">Limite Sugerido</span><span class="detail-value">${o.limite_sugerido ? fmtMoeda(o.limite_sugerido) : '—'}</span></div>
      <div class="detail-row"><span class="detail-label">Limite Aprovado</span><span class="detail-value" style="font-weight:700;color:#16a34a">${fmtMoeda(o.limite_aprovado)}</span></div>
    </div>` : ''}

    ${(o.documentos_base64 && o.documentos_base64.length > 0) ? `<div class="detail-section">
      <h4>Documentos Enviados</h4>
      ${o.documentos_base64.map(d => {
        const labels = {contrato_social:'Contrato Social',cartao_cnpj:'Cartao CNPJ',comprovante_endereco:'Comprovante Endereco',docs_socios:'Docs Socios',balanco:'Balanco',dre:'DRE',alvara:'Alvara'};
        const sizeKb = Math.round(d.base64.length * 0.75 / 1024);
        return `<div class="detail-row">
          <span class="detail-label">${labels[d.tipo] || d.tipo}</span>
          <span class="detail-value"><a href="#" onclick="abrirDoc('${d.mime_type}','${d.tipo}');return false" style="color:#25bbee;text-decoration:none;font-weight:500">${d.nome}</a> <span style="color:#a0aec0;font-size:11px">(${sizeKb}KB)</span></span>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${o.aprovador_docs_observacoes || o.aprovador_credito_observacoes ? `<div class="detail-section">
      <h4>Observacoes</h4>
      ${o.aprovador_docs_observacoes ? '<div style="font-size:13px;margin-bottom:6px"><strong>ADM Vendas:</strong> ' + o.aprovador_docs_observacoes + '</div>' : ''}
      ${o.aprovador_credito_observacoes ? '<div style="font-size:13px"><strong>Financeiro:</strong> ' + o.aprovador_credito_observacoes + '</div>' : ''}
    </div>` : ''}

    ${o.motivo_rejeicao ? `<div class="detail-section" style="border-color:#fecaca;background:#fef2f2">
      <h4 style="color:#991b1b">Motivo da Rejeicao</h4>
      <div style="font-size:13px;color:#991b1b">${o.motivo_rejeicao}</div>
    </div>` : ''}

    ${actionsHtml}
  `;
  openModal(html);
}

function buildOnbActions(o) {
  const role = getUserRole();
  const etapa = o.etapa_atual;
  let html = '';

  if (etapa === 'formulario') {
    if (['admin','manager','analyst'].includes(role)) {
      html = `
        <div class="action-bar">
          <span style="font-size:12px;color:#718096;flex:1">Avancar para revisao de documentos</span>
          <button class="btn btn-success btn-sm" onclick="avancarOnb('${o.id}','aprovacao_docs')">Enviar para Docs</button>
        </div>`;
    }
  }

  if (etapa === 'aprovacao_docs') {
    if (['admin','manager','analyst'].includes(role)) {
      html = `
        <div class="form-row" style="margin-top:16px"><label>Observacoes (opcional)</label><textarea id="onbObs" rows="2" placeholder="Observacoes sobre os documentos..."></textarea></div>
        <div class="action-bar">
          <button class="btn btn-danger btn-sm" onclick="rejeitarOnb('${o.id}')">Rejeitar</button>
          <button class="btn btn-success btn-sm" onclick="avancarOnb('${o.id}','validacao_ia',{aprovador_docs_id:getUserId(),aprovador_docs_observacoes:document.getElementById('onbObs').value})">Aprovar Documentos</button>
        </div>`;
    }
  }

  if (etapa === 'validacao_ia') {
    if (['admin','manager','analyst'].includes(role)) {
      html = `
        <div class="action-bar">
          <span style="font-size:12px;color:#718096;flex:1">IA ainda nao implementada — avancar manualmente</span>
          <button class="btn btn-warn btn-sm" onclick="avancarOnb('${o.id}','aprovacao_adm_vendas')">Pular IA (MVP)</button>
        </div>`;
    }
  }

  if (etapa === 'aprovacao_adm_vendas') {
    if (['admin','manager'].includes(role)) {
      html = `
        <div class="form-row" style="margin-top:16px"><label>Observacoes ADM Vendas</label><textarea id="onbObsAdm" rows="2" placeholder="Parecer sobre o cadastro..."></textarea></div>
        <div class="action-bar">
          <button class="btn btn-danger btn-sm" onclick="rejeitarOnb('${o.id}')">Rejeitar</button>
          <button class="btn btn-success btn-sm" onclick="avancarOnb('${o.id}','analise_credito',{aprovador_docs_id:getUserId(),aprovador_docs_observacoes:document.getElementById('onbObsAdm').value,docs_status:'aprovado',docs_aprovado_em:new Date().toISOString()})">Aprovar Cadastro</button>
        </div>`;
    }
  }

  if (etapa === 'analise_credito') {
    if (['admin','manager','financial'].includes(role)) {
      html = `
        <div class="action-bar">
          <span style="font-size:12px;color:#718096;flex:1">IA de credito ainda nao implementada — avancar para financeiro</span>
          <button class="btn btn-warn btn-sm" onclick="avancarOnb('${o.id}','aprovacao_credito')">Enviar para Financeiro</button>
        </div>`;
    }
  }

  if (etapa === 'aprovacao_credito') {
    if (['admin','financial'].includes(role)) {
      html = `
        <div class="form-row" style="margin-top:16px">
          <label>Limite de Credito (R$)</label>
          <input type="number" id="onbLimite" placeholder="Ex: 10000.00" step="0.01" min="0">
          <div style="font-size:11px;color:#718096;margin-top:3px">Politica: limite inicial = valor da primeira compra. Prazo 28/56/84 dias.</div>
        </div>
        <div class="form-row"><label>Observacoes Financeiro</label><textarea id="onbObsFin" rows="2" placeholder="Parecer sobre o credito..."></textarea></div>
        <div class="action-bar">
          <button class="btn btn-danger btn-sm" onclick="rejeitarOnb('${o.id}')">Rejeitar</button>
          <button class="btn btn-success btn-sm" onclick="aprovarCredito('${o.id}')">Aprovar Credito</button>
        </div>`;
    }
  }

  if (etapa === 'ativacao') {
    if (['admin'].includes(role)) {
      html = `
        <div style="margin-top:16px;padding:14px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px">
          <div style="font-size:13px;color:#166534;margin-bottom:8px"><strong>Etapa final.</strong> Ao ativar, o sistema ira:</div>
          <ul style="font-size:12px;color:#166534;margin:0 0 0 16px;line-height:1.8">
            <li>Criar cadastro no ZEN ERP (Person, endereco, contatos)</li>
            <li>Definir limite de credito no ZEN (R$ ${o.limite_aprovado ? o.limite_aprovado.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '0'})</li>
            <li>Criar usuario no Hub (login + senha temporaria)</li>
            <li>Gerar credenciais de acesso para o revendedor</li>
          </ul>
        </div>
        <div class="action-bar">
          <span style="font-size:12px;color:#718096;flex:1">Email do cliente: <strong>${o.contato_email || '—'}</strong></span>
          <button class="btn btn-success btn-sm" onclick="confirmarAtivacao('${o.id}')">Ativar Cliente</button>
        </div>`;
    }
  }

  return html;
}

async function avancarOnb(id, novaEtapa, extraFields) {
  try {
    const body = { etapa_atual: novaEtapa, atualizado_em: new Date().toISOString() };
    if (extraFields) Object.assign(body, extraFields);
    await sb('/hub_onboarding?id=eq.' + id, 'PATCH', body);
    toast('Cadastro avancado para: ' + etapaLabel(novaEtapa));
    closeModal();
    await loadOnboardings();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

async function rejeitarOnb(id) {
  const motivo = prompt('Motivo da rejeicao:');
  if (!motivo) return;
  try {
    await sb('/hub_onboarding?id=eq.' + id, 'PATCH', {
      etapa_atual: 'rejeitado',
      motivo_rejeicao: motivo,
      atualizado_em: new Date().toISOString()
    });
    toast('Cadastro rejeitado');
    closeModal();
    await loadOnboardings();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

async function aprovarCredito(id) {
  const limite = parseFloat(document.getElementById('onbLimite').value);
  if (!limite || limite <= 0) { toast('Informe um limite valido', 'error'); return; }
  const obs = document.getElementById('onbObsFin').value;
  try {
    await sb('/hub_onboarding?id=eq.' + id, 'PATCH', {
      etapa_atual: 'ativacao',
      limite_aprovado: limite,
      credito_status: 'aprovado',
      aprovador_credito_id: getUserId(),
      aprovador_credito_observacoes: obs,
      credito_aprovado_em: new Date().toISOString(),
      atualizado_em: new Date().toISOString()
    });
    toast('Credito aprovado — R$ ' + limite.toLocaleString('pt-BR', {minimumFractionDigits:2}));
    closeModal();
    await loadOnboardings();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  }
}

function confirmarAtivacao(id) {
  const o = allOnboardings.find(x => x.id === id);
  if (!o) return;
  openModal(`
    <h3 style="font-size:18px;color:#1d327b;margin-bottom:16px">Confirmar Ativacao</h3>
    <div style="padding:14px;background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;margin-bottom:16px">
      <div style="font-size:13px;color:#92400e"><strong>Atencao:</strong> esta acao nao pode ser desfeita. Sera criado um usuario de acesso ao Hub e um cadastro no ZEN ERP.</div>
    </div>
    <div style="font-size:14px;margin-bottom:16px">
      <div style="margin-bottom:6px"><strong>${o.razao_social}</strong></div>
      <div style="font-size:13px;color:#718096">CNPJ: ${fmtCnpj(o.cnpj)} | Email: ${o.contato_email}</div>
      <div style="font-size:13px;color:#718096">Limite aprovado: <strong style="color:#16a34a">${fmtMoeda(o.limite_aprovado)}</strong></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" id="btnAtivar" onclick="ativarCliente('${o.id}')">Confirmar e Ativar</button>
    </div>
  `);
}

async function ativarCliente(id) {
  const btn = document.getElementById('btnAtivar');
  if (btn) { btn.disabled = true; btn.textContent = 'Ativando...'; }

  try {
    const r = await fetch('/api/ativar', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SESSION.access_token
      },
      body: JSON.stringify({ onboarding_id: id })
    });
    const data = await r.json();

    if (!r.ok || !data.ok) {
      toast(data.error || 'Erro na ativacao', 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Confirmar e Ativar'; }
      return;
    }

    openModal(`
      <h3 style="font-size:18px;color:#16a34a;margin-bottom:16px">Cliente Ativado</h3>

      <div style="padding:16px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;margin-bottom:16px">
        <div style="font-size:14px;font-weight:700;color:#166534;margin-bottom:12px">${data.razao_social}</div>
        <div style="display:grid;gap:8px">
          <div style="display:flex;justify-content:space-between;font-size:13px">
            <span style="color:#718096">Login</span>
            <strong style="color:#1a202c">${data.email}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px">
            <span style="color:#718096">Senha temporaria</span>
            <strong style="color:#e30613;font-family:monospace;font-size:14px">${data.senha_temp}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px">
            <span style="color:#718096">Limite de credito</span>
            <strong style="color:#16a34a">${fmtMoeda(data.limite)}</strong>
          </div>
          ${data.erp_cliente_id ? `<div style="display:flex;justify-content:space-between;font-size:13px">
            <span style="color:#718096">ID no ZEN</span>
            <strong style="color:#1a202c">${data.erp_cliente_id}</strong>
          </div>` : ''}
        </div>
      </div>

      ${data.zen_status !== 'ok' ? `<div style="padding:10px 14px;background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;margin-bottom:16px;font-size:12px;color:#92400e">
        <strong>ZEN:</strong> ${data.zen_status === 'nao_configurado' ? 'Credenciais ZEN nao configuradas no servidor. Cadastre manualmente no ZEN.' : data.zen_status}
      </div>` : ''}

      <div style="padding:10px 14px;background:#dbeafe;border:1px solid #93c5fd;border-radius:8px;margin-bottom:16px;font-size:12px;color:#1e40af">
        <strong>Proximo passo:</strong> Envie as credenciais acima para o cliente por email. O cliente devera trocar a senha no primeiro acesso.
      </div>

      <div class="form-actions">
        <button class="btn btn-outline btn-sm" onclick="copiarCredenciais('${data.email}','${data.senha_temp}','${data.limite}','${data.razao_social}')">Copiar credenciais</button>
        <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
      </div>
    `);

    await loadOnboardings();

  } catch (e) {
    toast('Erro de conexao: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Confirmar e Ativar'; }
  }
}

function abrirDoc(mimeType, tipo) {
  const o = allOnboardings.find(x => x.id === _currentOnbId);
  if (!o) { toast('Documento nao encontrado', 'error'); return; }
  const doc = (o.documentos_base64 || []).find(d => d.tipo === tipo);
  if (!doc) { toast('Documento nao encontrado', 'error'); return; }
  const blob = base64ToBlob(doc.base64, doc.mime_type);
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function base64ToBlob(base64, mimeType) {
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mimeType });
}

function copiarCredenciais(email, senha, limite, razao) {
  const texto = `Boxer Hub — Credenciais de Acesso\n\nEmpresa: ${razao}\nLogin: ${email}\nSenha temporaria: ${senha}\nLimite de credito: R$ ${parseFloat(limite||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}\n\nAcesse: https://app.boxersoldas.com.br/hub\nRecomendamos trocar a senha no primeiro acesso.`;
  navigator.clipboard.writeText(texto).then(() => toast('Credenciais copiadas!')).catch(() => toast('Erro ao copiar', 'error'));
}
